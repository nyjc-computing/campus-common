[tool.poetry]
name = "campus-common"
version = "0.2.0"
description = "Campus shared kernel: env, errors, introspect, schema, utils, validation - PEP 420 namespace portion under campus/common"
authors = ["Ng Jun Siang <ngjunsiang@gmail.com>"]
readme = "README.md"
packages = [{include = "campus/common", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.15"
bcrypt = "^5.0.0"

[tool.poetry.group.dev.dependencies]
# Test-only: campus.common itself is flask-free at import time (#861) -
# the error-handler tests exercise handlers inside a live Flask test app.
flask = "^3.0.0"
werkzeug = "^3.0.0"
ruff = "^0.16.9"
pyright = "^1.1.391"

[tool.pyright]
include = ["src", "tests"]
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"
stubPath = ""
exclude = ["**/__pycache__", ".venv"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'SIM']
# Policy (mirrors the campus monorepo): ruff enforces style; humans rewrite
# code. Autofixes are disabled repo-wide (see campus docs/STYLE-GUIDE.md).
fixable = []
ignore = [
    'W291', 'W292', 'W293',  # trailing whitespace: formatting, not lint
]

[tool.ruff.lint.per-file-ignores]
# scripts/ bootstraps sys.path before importing campus - intentional.
"scripts/*" = ['E402']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
